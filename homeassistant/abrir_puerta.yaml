alias: "Fermax — Abrir puerta"
sequence:
  - service: switch.turn_on
    target:
      entity_id: switch.fermax_camara
  - delay: "00:00:01"
  - service: switch.turn_on
    target:
      entity_id: switch.fermax_llave
  - delay: "00:00:00.500"
  - service: switch.turn_off
    target:
      entity_id: switch.fermax_llave
  - service: switch.turn_off
    target:
      entity_id: switch.fermax_camara
